name: Build llm-server GUI Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: windows-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            windows-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: llm-server-gui-windows
          path: |
            release/*.exe
            release/*.blockmap
